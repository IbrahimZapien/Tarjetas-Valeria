<!-- Seña LSM "estrella" (según fotos de referencia):
     1) manos frente a la barbilla, índice y medio extendidos, los dedos de ambas manos se cruzan formando un triángulo;
     2) sin cambiar la configuración, las manos suben por encima de la cabeza y la mirada las sigue hacia arriba.
     Movimiento 1 = manos punteadas; movimiento 2 = manos sólidas; flecha rosa = recorrido. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
  <defs>
    <!-- Mano en configuración "V". Coordenadas locales: muñeca en (0,40), dedos hacia arriba. -->
    <g id="mano" stroke="#2B1B5C" stroke-width="6" stroke-linejoin="round" fill="#F7C9A8">
      <rect x="-30" y="-150" width="27" height="140" rx="13.5"/>
      <rect x="1" y="-158" width="27" height="148" rx="13.5"/>
      <rect x="-36" y="-34" width="72" height="76" rx="30"/>
      <path d="M2 -8 q14 -4 26 4" fill="none" stroke-linecap="round"/>
      <path d="M4 10 q12 -3 22 3" fill="none" stroke-linecap="round"/>
      <rect x="-50" y="-22" width="24" height="54" rx="12" transform="rotate(-22 -38 5)"/>
    </g>
    <!-- la misma mano, punteada y transparente (posición inicial) -->
    <g id="mano-fantasma" stroke="#2B1B5C" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round" fill="#FFFFFF" fill-opacity=".8" opacity=".9">
      <rect x="-30" y="-150" width="27" height="140" rx="13.5"/>
      <rect x="1" y="-158" width="27" height="148" rx="13.5"/>
      <rect x="-36" y="-34" width="72" height="76" rx="30"/>
      <rect x="-50" y="-22" width="24" height="54" rx="12" transform="rotate(-22 -38 5)"/>
    </g>
    <marker id="punta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF4FA0"/>
    </marker>
  </defs>

  <!-- torso -->
  <path d="M110 540 C110 438 196 404 300 404 C404 404 490 438 490 540 Z" fill="#B9A7F5"/>
  <rect x="280" y="340" width="40" height="70" rx="18" fill="#EDB592"/>
  <path d="M268 406 Q300 432 332 406" fill="none" stroke="#9C86EE" stroke-width="8" stroke-linecap="round"/>

  <!-- brazos levantados (movimiento 2): hombro → codo → muñeca -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 470 L100 330 L192 214" stroke="#2B1B5C" stroke-width="56"/>
    <path d="M170 470 L100 330 L192 214" stroke="#9C86EE" stroke-width="44"/>
    <path d="M430 470 L500 330 L408 214" stroke="#2B1B5C" stroke-width="56"/>
    <path d="M430 470 L500 330 L408 214" stroke="#9C86EE" stroke-width="44"/>
  </g>

  <!-- cabello rizado -->
  <g fill="#7A3B2E">
    <circle cx="300" cy="206" r="34"/><circle cx="258" cy="216" r="32"/><circle cx="342" cy="216" r="32"/>
    <circle cx="234" cy="250" r="29"/><circle cx="366" cy="250" r="29"/>
    <circle cx="228" cy="288" r="26"/><circle cx="372" cy="288" r="26"/>
    <circle cx="236" cy="322" r="22"/><circle cx="364" cy="322" r="22"/>
  </g>
  <circle cx="300" cy="276" r="68" fill="#F7C9A8"/>
  <g fill="#7A3B2E">
    <circle cx="268" cy="218" r="24"/><circle cx="300" cy="211" r="24"/><circle cx="332" cy="218" r="24"/>
  </g>
  <!-- cara: mira hacia arriba, a sus manos -->
  <circle cx="276" cy="272" r="12" fill="#fff" stroke="#2B1B5C" stroke-width="3"/>
  <circle cx="324" cy="272" r="12" fill="#fff" stroke="#2B1B5C" stroke-width="3"/>
  <circle cx="276" cy="265" r="7" fill="#2B1B5C"/>
  <circle cx="324" cy="265" r="7" fill="#2B1B5C"/>
  <path d="M262 250 Q276 242 290 250 M310 250 Q324 242 338 250" fill="none" stroke="#7A3B2E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="296" r="9" fill="#FF9EC4" opacity=".85"/>
  <circle cx="344" cy="296" r="9" fill="#FF9EC4" opacity=".85"/>
  <path d="M288 300 Q300 312 312 300" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round"/>

  <!-- movimiento 1: manos punteadas frente a la barbilla -->
  <use href="#mano-fantasma" transform="translate(244 424) scale(.8) rotate(40)"/>
  <use href="#mano-fantasma" transform="translate(356 424) scale(-.8 .8) rotate(40)"/>

  <!-- recorrido -->
  <path d="M404 352 C470 310 470 230 400 150" fill="none" stroke="#FF4FA0" stroke-width="10" stroke-linecap="round" marker-end="url(#punta)"/>

  <!-- movimiento 2: manos sólidas arriba de la cabeza -->
  <use href="#mano" transform="translate(244 188) scale(.8) rotate(40)"/>
  <use href="#mano" transform="translate(356 188) scale(-.8 .8) rotate(40)"/>

  <!-- números de los pasos -->
  <g font-family="Fredoka, sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="#fff">
    <circle cx="180" cy="400" r="24" fill="#2B1B5C"/><text x="180" y="411">1</text>
    <circle cx="150" cy="80" r="24" fill="#FF4FA0"/><text x="150" y="91">2</text>
  </g>
</svg>
