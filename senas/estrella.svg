<!-- Seña LSM "estrella" (según fotos, videos de referencia y descripción del usuario):
     configuración: índice y medio extendidos en V; anular y meñique doblados, sujetos por el pulgar;
     los dedos de ambas manos se cruzan en X.
     Visto de frente (como en el video de referencia):
     1) la configuración empieza a la DERECHA del dibujo (lado izquierdo de quien señá), a la altura de la cara;
     2) las manos pasan por encima de la cabeza y terminan a la IZQUIERDA del dibujo, junto a la cara.
     La mirada sigue a las manos hacia arriba.
     Manos claras = inicio; manos con brazos = final; flecha rosa = recorrido. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
  <defs>
    <!-- Mano DERECHA con la palma al frente; el pulgar y el índice quedan hacia el centro (+x).
         Coordenadas locales: muñeca abajo (0,60), dedos hacia arriba. Estilo plano realista. -->
    <g id="mano" stroke="#B26E52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- muñeca -->
      <path d="M-27 36 L-25 96 L25 96 L29 36 Z" fill="#F5C6A5" stroke="none"/>
      <!-- palma (con el monte del pulgar abajo a la derecha) -->
      <path d="M-34 -44 C-39 -18 -39 10 -31 32 C-25 50 -10 58 6 58 C24 58 38 46 41 24 C44 4 42 -22 37 -44 Z" fill="#F5C6A5"/>
      <path d="M-34 -44 C-37 -20 -37 8 -31 30 C-29 36 -26 42 -22 46 C-30 28 -32 0 -30 -40 Z" fill="#E7AE8C" stroke="none"/>
      <!-- dedo medio (afuera) -->
      <path d="M-34 -38 C-36 -80 -35 -128 -33 -150 C-31 -168 -12 -168 -11 -150 C-9 -126 -8 -80 -6 -40 Z" fill="#F5C6A5"/>
      <!-- dedo índice (adentro), un poco abierto en V -->
      <path d="M-5 -40 C-1 -80 5 -118 9 -138 C13 -155 33 -152 31 -134 C28 -108 26 -76 27 -38 Z" fill="#F5C6A5"/>
      <!-- pliegues de los dedos -->
      <g fill="none" stroke="#C98668" stroke-width="2.5">
        <path d="M-31 -106 q10 4 19 0"/><path d="M-32 -72 q11 5 22 0"/>
        <path d="M11 -100 q9 5 18 2"/><path d="M5 -68 q10 5 20 2"/>
        <path d="M-24 40 q14 8 30 -4"/>
      </g>
      <!-- anular y meñique doblados, con sus uñas -->
      <rect x="-36" y="-34" width="38" height="22" rx="11" fill="#F0BC9A"/>
      <rect x="-38" y="-13" width="34" height="20" rx="10" fill="#F0BC9A"/>
      <ellipse cx="-4" cy="-23" rx="6" ry="7" fill="#F8D0CC"/>
      <ellipse cx="-7" cy="-3" rx="5.5" ry="6.5" fill="#F8D0CC"/>
      <!-- pulgar cruzando sobre ellos, con su uña -->
      <path d="M41 30 C32 10 14 -6 -6 -10 C-20 -12 -22 8 -8 11 C8 15 20 27 27 46 Z" fill="#F5C6A5"/>
      <path d="M41 30 C36 20 30 13 22 8 C28 18 32 30 34 42 Z" fill="#E7AE8C" stroke="none"/>
      <ellipse cx="-7" cy="0" rx="8" ry="6" fill="#F8D0CC" transform="rotate(-12 -7 0)"/>
    </g>
    <marker id="punta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF4FA0"/>
    </marker>
  </defs>

  <g transform="translate(600 0) scale(-1 1)">
  <!-- torso -->
  <path d="M172 540 C172 448 224 412 300 412 C376 412 428 448 428 540 Z" fill="#B9A7F5"/>
  <!-- estrellita en la blusa -->
  <path d="M300 456 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3z" fill="#FFD43B" stroke="#E0A800" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="285" y="362" width="30" height="58" rx="14" fill="#EDB592"/>
  <path d="M278 414 Q300 432 322 414" fill="none" stroke="#9C86EE" stroke-width="8" stroke-linecap="round"/>

  <!-- cabeza -->
  <g fill="#7A3B2E">
    <circle cx="300" cy="248" r="30"/><circle cx="262" cy="257" r="28"/><circle cx="338" cy="257" r="28"/>
    <circle cx="242" cy="288" r="26"/><circle cx="358" cy="288" r="26"/>
    <circle cx="237" cy="322" r="23"/><circle cx="363" cy="322" r="23"/>
    <circle cx="244" cy="352" r="19"/><circle cx="356" cy="352" r="19"/>
  </g>
  <circle cx="300" cy="312" r="60" fill="#F7C9A8"/>
  <g fill="#7A3B2E">
    <circle cx="272" cy="260" r="21"/><circle cx="300" cy="254" r="21"/><circle cx="328" cy="260" r="21"/>
  </g>
  <circle cx="279" cy="308" r="11" fill="#fff" stroke="#2B1B5C" stroke-width="3"/>
  <circle cx="321" cy="308" r="11" fill="#fff" stroke="#2B1B5C" stroke-width="3"/>
  <circle cx="279" cy="302" r="6.5" fill="#2B1B5C"/>
  <circle cx="321" cy="302" r="6.5" fill="#2B1B5C"/>
  <circle cx="261" cy="332" r="8" fill="#FF9EC4" opacity=".85"/>
  <circle cx="339" cy="332" r="8" fill="#FF9EC4" opacity=".85"/>
  <path d="M290 336 Q300 346 310 336" fill="none" stroke="#2B1B5C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- broche de estrella -->
  <path d="M346 250 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z" fill="#FF5DA2" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- destellos junto a las manos (posición final) -->
  <path d="M528 196 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFD43B"/>
  <path d="M392 206 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#FF5DA2"/>

  <!-- 1: inicio, a su derecha (claro) -->
  <g opacity=".55">
    <use href="#mano" transform="translate(117 342) scale(.56) rotate(40)"/>
    <use href="#mano" transform="translate(193 342) scale(-.56 .56) rotate(40)"/>
  </g>

  <!-- recorrido por encima de la cabeza -->
  <path d="M150 172 C200 80 400 80 452 168" fill="none" stroke="#FF4FA0" stroke-width="10" stroke-linecap="round" marker-end="url(#punta)"/>

  <!-- 2: final, a su izquierda: un antebrazo sube recto y el otro cruza por delante del pecho -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 556 L385 368" stroke="#2B1B5C" stroke-width="40"/>
    <path d="M318 556 L385 368" stroke="#9C86EE" stroke-width="30"/>
    <path d="M410 446 L482 498 L505 368" stroke="#2B1B5C" stroke-width="40"/>
    <path d="M410 446 L482 498 L505 368" stroke="#9C86EE" stroke-width="30"/>
  </g>
  <use href="#mano" transform="translate(407 342) scale(.56) rotate(40)"/>
  <use href="#mano" transform="translate(483 342) scale(-.56 .56) rotate(40)"/>

  </g>

  <!-- números -->
  <g font-family="Fredoka, sans-serif" font-weight="700" font-size="28" text-anchor="middle" fill="#fff">
    <circle cx="566" cy="262" r="22" fill="#2B1B5C"/><text x="566" y="272">1</text>
    <circle cx="44" cy="262" r="22" fill="#FF4FA0"/><text x="44" y="272">2</text>
  </g>
</svg>
