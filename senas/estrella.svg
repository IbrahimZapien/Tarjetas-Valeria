<!-- Seña LSM "estrella", movimiento 1 (según foto de referencia):
     manos frente a la barbilla, índice y medio extendidos en cada mano,
     los dedos de ambas manos se cruzan al centro formando un triángulo / X. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <defs>
    <!-- Mano en configuración "V": índice y medio extendidos, anular y meñique doblados, pulgar al lado.
         Coordenadas locales: muñeca en (0,40) y dedos apuntando hacia arriba. -->
    <g id="mano" stroke="#2B1B5C" stroke-width="6" stroke-linejoin="round" fill="#F7C9A8">
      <rect x="-30" y="-150" width="27" height="140" rx="13.5"/>
      <rect x="1" y="-158" width="27" height="148" rx="13.5"/>
      <rect x="-36" y="-34" width="72" height="76" rx="30"/>
      <!-- dedos doblados (anular y meñique) -->
      <path d="M2 -8 q14 -4 26 4" fill="none" stroke-linecap="round"/>
      <path d="M4 10 q12 -3 22 3" fill="none" stroke-linecap="round"/>
      <!-- pulgar -->
      <rect x="-50" y="-22" width="24" height="54" rx="12" transform="rotate(-22 -38 5)"/>
    </g>
  </defs>

  <!-- torso -->
  <path d="M96 440 C96 320 186 282 300 282 C414 282 504 320 504 440 Z" fill="#B9A7F5"/>
  <!-- cuello y cabeza -->
  <rect x="278" y="214" width="44" height="74" rx="20" fill="#EDB592"/>
  <path d="M266 284 Q300 312 334 284" fill="none" stroke="#9C86EE" stroke-width="8" stroke-linecap="round"/>
  <!-- cabello rizado (detrás) -->
  <g fill="#7A3B2E">
    <circle cx="300" cy="62" r="40"/><circle cx="252" cy="74" r="38"/><circle cx="348" cy="74" r="38"/>
    <circle cx="222" cy="112" r="34"/><circle cx="378" cy="112" r="34"/>
    <circle cx="214" cy="156" r="30"/><circle cx="386" cy="156" r="30"/>
    <circle cx="222" cy="196" r="26"/><circle cx="378" cy="196" r="26"/>
  </g>
  <circle cx="300" cy="140" r="80" fill="#F7C9A8"/>
  <!-- flequillo -->
  <g fill="#7A3B2E">
    <circle cx="262" cy="74" r="28"/><circle cx="300" cy="66" r="28"/><circle cx="338" cy="74" r="28"/>
  </g>
  <!-- cara tierna -->
  <circle cx="272" cy="138" r="9" fill="#2B1B5C"/>
  <circle cx="328" cy="138" r="9" fill="#2B1B5C"/>
  <circle cx="275" cy="135" r="3" fill="#fff"/>
  <circle cx="331" cy="135" r="3" fill="#fff"/>
  <circle cx="250" cy="164" r="11" fill="#FF9EC4" opacity=".85"/>
  <circle cx="350" cy="164" r="11" fill="#FF9EC4" opacity=".85"/>
  <path d="M286 172 Q300 184 314 172" fill="none" stroke="#2B1B5C" stroke-width="6" stroke-linecap="round"/>

  <!-- antebrazos (mangas) que suben desde abajo hasta las manos -->
  <g stroke-linecap="round">
    <path d="M128 440 L214 332" stroke="#2B1B5C" stroke-width="66"/>
    <path d="M128 440 L214 332" stroke="#9C86EE" stroke-width="54"/>
    <path d="M472 440 L386 332" stroke="#2B1B5C" stroke-width="66"/>
    <path d="M472 440 L386 332" stroke="#9C86EE" stroke-width="54"/>
  </g>

  <!-- manos: los dedos se cruzan frente a la barbilla -->
  <use href="#mano" transform="translate(230 316) rotate(40)"/>
  <use href="#mano" transform="translate(370 316) scale(-1 1) rotate(40)"/>
</svg>
