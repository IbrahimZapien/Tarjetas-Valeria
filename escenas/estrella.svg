<!-- Escena "estrella": una pelota rueda por un puente elevado comiendo monedas
     y llega a la estrella squishy (la meta), suave y brillante como slime. Inspirada en los juegos de destreza que ve Valeria.
     Lienzo: 1056 x 428 (panel superior de la tarjeta). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 30 930 420">
  <!-- pocos destellos, para no distraer del dibujo principal -->
  <path d="M120 70 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z" fill="#FFFFFF"/>
  <path d="M930 60 l7 15 15 7 -15 7 -7 15 -7 -15 -15 -7 15 -7z" fill="#FF5DA2"/>
  <path d="M960 200 l6 12 12 6 -12 6 -6 12 -6 -12 -12 -6 12 -6z" fill="#FFD43B"/>

  <!-- puente elevado -->
  <rect x="150" y="372" width="22" height="70" rx="6" fill="#3D8FD1"/>
  <rect x="520" y="372" width="22" height="70" rx="6" fill="#3D8FD1"/>
  <rect x="890" y="372" width="22" height="70" rx="6" fill="#3D8FD1"/>
  <rect x="40" y="350" width="976" height="30" rx="15" fill="#FFFFFF"/>
  <rect x="40" y="372" width="976" height="10" rx="5" fill="#C9C2F2"/>

  <!-- camino de monedas hacia la estrella -->
  <g fill="#FFD43B" stroke="#C98A00" stroke-width="4">
    <circle cx="250" cy="322" r="14"/>
    <circle cx="300" cy="322" r="14"/>
    <circle cx="350" cy="322" r="14"/>
    <circle cx="400" cy="322" r="14"/>
  </g>

  <!-- pelota rodando (rosa, brillante como slime) -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="300" x2="100" y2="300"/>
    <line x1="48" y1="326" x2="98" y2="326"/>
  </g>
  <circle cx="160" cy="306" r="44" fill="#FF5DA2" stroke="#FFFFFF" stroke-width="6"/>
  <ellipse cx="145" cy="288" rx="14" ry="9" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 145 288)"/>

  <!-- la estrella SQUISHY: gordita, puntas redondas, brillante como gel y un poco aplastada -->
  <defs>
    <radialGradient id="gel" cx=".36" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFF7C2"/><stop offset=".45" stop-color="#FFDF4F"/><stop offset="1" stop-color="#FFB21C"/>
    </radialGradient>
  </defs>
  <!-- sombra suave sobre el puente -->
  <ellipse cx="640" cy="352" rx="160" ry="11" fill="#2B1B5C" opacity=".14"/>
  <g transform="translate(640 222) scale(1.1 .9)">
    <!-- contorno blanco gordito -->
    <path d="M0.0 -128.0 L43.5 -59.9 L121.7 -39.6 L70.4 22.9 L75.2 103.6 L0.0 74.0 L-75.2 103.6 L-70.4 22.9 L-121.7 -39.6 L-43.5 -59.9 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="86" stroke-linejoin="round"/>
    <!-- cuerpo de gel: el trazo grueso redondea y "infla" las puntas -->
    <path d="M0.0 -128.0 L43.5 -59.9 L121.7 -39.6 L70.4 22.9 L75.2 103.6 L0.0 74.0 L-75.2 103.6 L-70.4 22.9 L-121.7 -39.6 L-43.5 -59.9 Z" fill="url(#gel)" stroke="url(#gel)" stroke-width="64" stroke-linejoin="round"/>
    <!-- brillos de squishy -->
    <ellipse cx="-58" cy="-78" rx="30" ry="13" fill="#FFFFFF" opacity=".85" transform="rotate(-38 -58 -78)"/>
    <circle cx="-26" cy="-104" r="7" fill="#FFFFFF" opacity=".9"/>
    <ellipse cx="96" cy="-34" rx="16" ry="7" fill="#FFFFFF" opacity=".55" transform="rotate(-12 96 -34)"/>
    <!-- gotita de slime -->
    <path d="M58 92 C58 112 70 126 70 136 C70 148 52 148 52 136 C52 126 58 112 58 92 Z" fill="#FFC93A"/>
    <ellipse cx="57" cy="134" rx="4" ry="6" fill="#FFFFFF" opacity=".7"/>
    <!-- carita kawaii -->
    <ellipse cx="-30" cy="-4" rx="13" ry="15" fill="#2B1B5C"/>
    <ellipse cx="30" cy="-4" rx="13" ry="15" fill="#2B1B5C"/>
    <circle cx="-25" cy="-10" r="5.5" fill="#FFFFFF"/>
    <circle cx="35" cy="-10" r="5.5" fill="#FFFFFF"/>
    <circle cx="-33" cy="3" r="2.5" fill="#FFFFFF"/>
    <circle cx="27" cy="3" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="-58" cy="22" rx="17" ry="11" fill="#FF8FB8" opacity=".9"/>
    <ellipse cx="58" cy="22" rx="17" ry="11" fill="#FF8FB8" opacity=".9"/>
    <path d="M-12 18 Q-6 26 0 18 Q6 26 12 18" fill="none" stroke="#2B1B5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- líneas de "squish" a los lados -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M452 300 q-14 -10 -10 -26"/><path d="M432 316 q-12 -6 -12 -18"/>
    <path d="M828 300 q14 -10 10 -26"/><path d="M848 316 q12 -6 12 -18"/>
  </g>
</svg>
