<!-- Escena "taco" (sin estrellas: adornos de cilantro y cebolla): un taco squishy kawaii en la cocina (a Valeria le encanta cocinar y lo picante).
     Gordito y brillante, con salsa roja que escurre como slime, sobre una tabla de picar,
     con un chilito tierno y un limón. Lienzo ~3.4:1 para el panel de 1160 x 340. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 386">
  <defs>
    <radialGradient id="tortilla" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".55" stop-color="#FFD66B"/><stop offset="1" stop-color="#F2A93B"/></radialGradient>
    <linearGradient id="salsa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#D81E3A"/></linearGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B98A"/><stop offset="1" stop-color="#C98A5A"/></linearGradient>
    <radialGradient id="chile" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#E0263A"/></radialGradient>
    <radialGradient id="limon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E9FF9A"/><stop offset="1" stop-color="#7BCB2E"/></radialGradient>
  </defs>
  <!-- adornos taqueros (pocos): cilantro y cebolla -->
  <g fill="#3FBF5A" transform="translate(160 90) scale(1.4) rotate(-20)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="#3FBF5A" transform="translate(1140 90) scale(1.1) rotate(25)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="none" transform="translate(1110 190)"><circle r="20" stroke="#E9C9FF" stroke-width="7"/><circle r="10" stroke="#D9B0FF" stroke-width="5"/></g>
  <!-- vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M520 70 q-14 -18 0 -36"/><path d="M800 70 q-14 -18 0 -36"/>
  </g>
  <!-- tabla de picar -->
  <rect x="300" y="318" width="720" height="44" rx="22" fill="url(#tabla)"/>
  <rect x="300" y="350" width="720" height="12" rx="6" fill="#A8693F" opacity=".5"/>
  <circle cx="990" cy="340" r="9" fill="#A8693F"/>
  <ellipse cx="640" cy="318" rx="170" ry="12" fill="#5A2A10" opacity=".2"/>
  <!-- taco squishy con la forma del emoji 🌮 (referencia del usuario): inclinado en diagonal,
