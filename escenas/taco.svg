<!-- Escena "taco": un taco squishy kawaii en la cocina (a Valeria le encanta cocinar y lo picante).
     Gordito y brillante, con salsa roja que escurre como slime, sobre una tabla de picar,
     con un chilito tierno y un limón. Lienzo ~3.4:1 para el panel de 1160 x 340. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 386">
  <defs>
    <radialGradient id="tortilla" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".55" stop-color="#FFD66B"/><stop offset="1" stop-color="#F2A93B"/></radialGradient>
    <linearGradient id="salsa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#D81E3A"/></linearGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B98A"/><stop offset="1" stop-color="#C98A5A"/></linearGradient>
    <radialGradient id="chile" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#E0263A"/></radialGradient>
    <radialGradient id="limon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E9FF9A"/><stop offset="1" stop-color="#7BCB2E"/></radialGradient>
  </defs>
  <!-- destellos (pocos) -->
  <path d="M150 70 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7z" fill="#FFFFFF"/>
  <path d="M1160 60 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6z" fill="#FF7AB8"/>
  <path d="M1110 170 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFD43B"/>
  <!-- vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M590 70 q-18 -22 0 -44"/><path d="M660 58 q-18 -22 0 -44"/><path d="M730 70 q-18 -22 0 -44"/>
  </g>
  <!-- tabla de picar -->
  <rect x="300" y="318" width="720" height="44" rx="22" fill="url(#tabla)"/>
  <rect x="300" y="350" width="720" height="12" rx="6" fill="#A8693F" opacity=".5"/>
  <circle cx="990" cy="340" r="9" fill="#A8693F"/>
  <ellipse cx="660" cy="322" rx="250" ry="14" fill="#5A2A10" opacity=".18"/>
  <!-- taco squishy: tortilla doblada (media luna gordita, un poco aplastada) -->
  <g transform="translate(660 214) rotate(-6)">
    <!-- parte de atrás de la tortilla doblada (asoma detrás del relleno) -->
    <path d="M-214 10 C-214 -190 214 -190 214 10 Z" fill="#F2B347" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-150 -60 C-110 -130 110 -130 150 -60" fill="none" stroke="#FFE7A0" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    <!-- relleno que asoma: lechuga, carne, queso -->
    <path d="M-200 34 C-190 -40 -110 -96 0 -98 C110 -96 190 -40 200 34 Z" fill="#7BCB2E"/>
    <g fill="#9CE04A">
      <circle cx="-150" cy="-30" r="26"/><circle cx="-100" cy="-66" r="28"/><circle cx="-40" cy="-86" r="28"/>
      <circle cx="30" cy="-88" r="28"/><circle cx="95" cy="-70" r="28"/><circle cx="150" cy="-36" r="26"/>
    </g>
    <g fill="#B5562E"><circle cx="-110" cy="-40" r="20"/><circle cx="-50" cy="-60" r="22"/><circle cx="20" cy="-62" r="22"/><circle cx="85" cy="-48" r="20"/></g>
    <g fill="#FFF3D6"><rect x="-80" y="-74" width="16" height="16" rx="5"/><rect x="50" y="-76" width="16" height="16" rx="5"/><rect x="-10" y="-82" width="14" height="14" rx="5"/></g>
    <!-- salsa roja que escurre como slime -->
    <path d="M-160 -10 C-120 -40 -60 -54 0 -54 C60 -54 120 -40 160 -10 C150 10 120 12 112 0 C100 30 80 30 76 4 C40 20 -30 20 -60 4 C-66 34 -92 34 -96 6 C-118 18 -150 14 -160 -10 Z" fill="url(#salsa)"/>
    <ellipse cx="-60" cy="-40" rx="22" ry="7" fill="#fff" opacity=".55"/>
    <!-- tortilla -->
    <path d="M-214 40 C-214 -70 -118 -120 0 -120 C118 -120 214 -70 214 40 C214 108 120 128 0 128 C-120 128 -214 108 -214 40 Z" fill="none"/>
    <path d="M-214 -4 C-214 92 -118 132 0 132 C118 132 214 92 214 -4 C150 22 80 30 0 30 C-80 30 -150 22 -214 -4 Z" fill="url(#tortilla)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <g fill="#E99A3A" opacity=".55"><circle cx="-130" cy="88" r="6"/><circle cx="-60" cy="104" r="5"/><circle cx="110" cy="92" r="6"/><circle cx="160" cy="62" r="5"/><circle cx="40" cy="108" r="5"/></g>
    <ellipse cx="-130" cy="56" rx="34" ry="11" fill="#fff" opacity=".7" transform="rotate(12 -120 62)"/>
    <!-- gotita de salsa -->
    <path d="M118 14 C118 34 126 46 126 54 C126 66 110 66 110 54 C110 46 118 34 118 14 Z" fill="#E0263A"/>
    <!-- carita kawaii -->
    <ellipse cx="-34" cy="88" rx="11" ry="13" fill="#2B1B5C"/><ellipse cx="34" cy="88" rx="11" ry="13" fill="#2B1B5C"/>
    <circle cx="-30" cy="83" r="4.5" fill="#fff"/><circle cx="38" cy="83" r="4.5" fill="#fff"/>
    <ellipse cx="-72" cy="104" rx="15" ry="9" fill="#FF8FB8"/><ellipse cx="72" cy="104" rx="15" ry="9" fill="#FF8FB8"/>
    <path d="M-12 104 Q-6 112 0 104 Q6 112 12 104" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- líneas de squish -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M428 270 q-14 -10 -10 -26"/><path d="M408 290 q-12 -6 -12 -18"/>
    <path d="M892 270 q14 -10 10 -26"/><path d="M912 290 q12 -6 12 -18"/>
  </g>
  <!-- chilito tierno (picante) -->
  <g transform="translate(250 286) rotate(-18)">
    <path d="M-50 0 C-50 -26 30 -30 56 -6 C70 8 60 24 40 20 C10 14 -20 20 -40 18 C-50 16 -50 8 -50 0 Z" fill="url(#chile)"/>
    <path d="M56 -6 C64 -16 72 -26 82 -24" fill="none" stroke="#3E9B2A" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-12" rx="14" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-4" cy="2" r="4" fill="#2B1B5C"/><circle cx="14" cy="0" r="4" fill="#2B1B5C"/>
    <path d="M0 10 Q5 14 10 10" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- limón tierno -->
  <g transform="translate(1080 288)">
    <ellipse rx="44" ry="34" fill="url(#limon)"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-10" cy="2" r="4" fill="#2B1B5C"/><circle cx="10" cy="2" r="4" fill="#2B1B5C"/>
    <path d="M-4 12 Q0 16 4 12" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
