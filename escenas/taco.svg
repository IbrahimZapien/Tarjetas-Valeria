  <defs><linearGradient id="tortiE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF08A"/><stop offset=".5" stop-color="#FFDB4D"/><stop offset="1" stop-color="#FFC21F"/></linearGradient></defs>
  <g transform="translate(486 42) scale(.74)">
<g>
