<!-- Escena "taco" (sin estrellas: adornos de cilantro y cebolla): un taco squishy kawaii en la cocina (a Valeria le encanta cocinar y lo picante).
     Gordito y brillante, con salsa roja que escurre como slime, sobre una tabla de picar,
     con un chilito tierno y un limón. Lienzo ~3.4:1 para el panel de 1160 x 340. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 386">
  <defs>
    <radialGradient id="tortilla" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".55" stop-color="#FFD66B"/><stop offset="1" stop-color="#F2A93B"/></radialGradient>
    <linearGradient id="salsa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#D81E3A"/></linearGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B98A"/><stop offset="1" stop-color="#C98A5A"/></linearGradient>
    <radialGradient id="chile" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#E0263A"/></radialGradient>
    <radialGradient id="limon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E9FF9A"/><stop offset="1" stop-color="#7BCB2E"/></radialGradient>
  </defs>
  <!-- adornos taqueros (pocos): cilantro y cebolla -->
  <g fill="#3FBF5A" transform="translate(160 90) scale(1.4) rotate(-20)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="#3FBF5A" transform="translate(1140 90) scale(1.1) rotate(25)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="none" transform="translate(1110 190)"><circle r="20" stroke="#E9C9FF" stroke-width="7"/><circle r="10" stroke="#D9B0FF" stroke-width="5"/></g>
  <!-- vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M520 70 q-14 -18 0 -36"/><path d="M800 70 q-14 -18 0 -36"/>
  </g>
  <!-- tabla de picar -->
  <rect x="300" y="318" width="720" height="44" rx="22" fill="url(#tabla)"/>
  <rect x="300" y="350" width="720" height="12" rx="6" fill="#A8693F" opacity=".5"/>
  <circle cx="990" cy="340" r="9" fill="#A8693F"/>
  <ellipse cx="660" cy="322" rx="190" ry="12" fill="#5A2A10" opacity=".2"/>
  <!-- taco squishy (como la foto de referencia del usuario): tortilla redonda doblada, PARADA sobre su doblez,
       vista en tres cuartos: se ve la pared de atrás (por dentro, más alta), la comida en medio
       y la pared de enfrente; las dos orillas se juntan en PUNTAS a los lados. -->
  <defs>
    <linearGradient id="torti" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset=".6" stop-color="#F59A2A"/><stop offset="1" stop-color="#E0761C"/></linearGradient>
    <linearGradient id="tortiDentro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB13A"/><stop offset="1" stop-color="#E8862A"/></linearGradient>
  </defs>
  <g transform="translate(660 226) rotate(-10) scale(.86 .8)">
    <!-- pared de ATRÁS (se ve por dentro): orilla curva hacia arriba, puntas a los lados -->
    <path d="M-246 22 C-190 -110 -80 -150 10 -150 C110 -150 200 -110 248 -6 C150 -30 -150 -20 -246 22 Z" fill="url(#tortiDentro)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- comida: carne, cilantro, cebolla -->
    <g fill="#8A4A24"><circle cx="-150" cy="-10" r="22"/><circle cx="-110" cy="-34" r="26"/><circle cx="-60" cy="-50" r="28"/><circle cx="-6" cy="-56" r="28"/><circle cx="48" cy="-52" r="28"/><circle cx="100" cy="-40" r="26"/><circle cx="146" cy="-22" r="22"/><circle cx="-90" cy="-6" r="24"/><circle cx="-30" cy="-14" r="26"/><circle cx="30" cy="-12" r="26"/><circle cx="88" cy="-4" r="22"/><circle cx="178" cy="-6" r="16"/><circle cx="-180" cy="4" r="14"/></g>
    <g fill="#5E2F14" opacity=".6"><circle cx="-39" cy="-13" r="9"/><circle cx="-94" cy="-27" r="9"/><circle cx="82" cy="-10" r="9"/><circle cx="-127" cy="-12" r="5"/><circle cx="80" cy="-34" r="9"/><circle cx="-41" cy="-38" r="8"/><circle cx="116" cy="-15" r="8"/><circle cx="43" cy="-10" r="6"/><circle cx="-42" cy="-10" r="6"/><circle cx="107" cy="-26" r="5"/><circle cx="-128" cy="-40" r="9"/><circle cx="-139" cy="-31" r="5"/><circle cx="-23" cy="-20" r="9"/><circle cx="38" cy="-5" r="8"/><circle cx="42" cy="-4" r="9"/><circle cx="67" cy="-42" r="7"/></g>
    <g fill="#3FBF5A"><g transform="translate(-121 -68) rotate(-23) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(83 -57) rotate(-7) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(53 -21) rotate(40) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(-16 -44) rotate(24) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(27 -34) rotate(4) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(103 -33) rotate(12) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(129 -56) rotate(3) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(-156 -16) rotate(-5) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(140 -28) rotate(-20) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(-3 -36) rotate(33) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g><g transform="translate(121 -64) rotate(-13) scale(1.15)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/></g></g>
    <g fill="#FFFFFF" stroke="#E6DDF0" stroke-width="1.5"><rect x="133" y="-43" width="14" height="13" rx="3" transform="rotate(-12)"/><rect x="-97" y="-56" width="14" height="13" rx="3" transform="rotate(0)"/><rect x="87" y="-55" width="14" height="13" rx="3" transform="rotate(-8)"/><rect x="-126" y="-34" width="14" height="13" rx="3" transform="rotate(27)"/><rect x="-83" y="-59" width="14" height="13" rx="3" transform="rotate(-12)"/><rect x="58" y="-11" width="14" height="13" rx="3" transform="rotate(-4)"/><rect x="-100" y="-58" width="14" height="13" rx="3" transform="rotate(8)"/><rect x="-137" y="-36" width="14" height="13" rx="3" transform="rotate(15)"/><rect x="140" y="-39" width="14" height="13" rx="3" transform="rotate(5)"/><rect x="-18" y="-28" width="14" height="13" rx="3" transform="rotate(-15)"/><rect x="-142" y="-41" width="14" height="13" rx="3" transform="rotate(-30)"/><rect x="-121" y="-54" width="14" height="13" rx="3" transform="rotate(8)"/></g>
    <!-- pared de ENFRENTE: orilla de arriba (borde que se ve), doblez redondo abajo, mismas puntas -->
    <path d="M-246 22 C-140 40 120 30 248 -6 C230 80 140 140 6 140 C-130 140 -220 100 -246 22 Z" fill="url(#torti)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- orilla tostada de la pared de enfrente -->
    <path d="M-226 26 C-130 42 120 32 228 -2" fill="none" stroke="#D2691A" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <!-- puntitos tostados -->
    <g fill="#B5531A" opacity=".55"><circle cx="-150" cy="50" r="6"/><circle cx="-100" cy="120" r="5"/><circle cx="120" cy="100" r="6"/><circle cx="170" cy="40" r="5"/><circle cx="40" cy="140" r="5"/><circle cx="-40" cy="40" r="4"/><circle cx="80" cy="30" r="4"/><circle cx="-180" cy="80" r="4"/></g>
    <g fill="#B5531A" opacity=".45"><circle cx="-120" cy="-120" r="5"/><circle cx="60" cy="-150" r="5"/><circle cx="160" cy="-90" r="5"/><circle cx="-60" cy="-150" r="4"/></g>
    <!-- brillo de squishy -->
    <ellipse cx="-120" cy="70" rx="40" ry="12" fill="#fff" opacity=".65" transform="rotate(28 -120 70)"/>
    <circle cx="-150" cy="104" r="7" fill="#fff" opacity=".8"/>
    <!-- gotita de salsa -->
    <path d="M160 22 C160 42 168 54 168 62 C168 74 152 74 152 62 C152 54 160 42 160 22 Z" fill="#E0263A"/>
    <!-- carita kawaii en la pared de enfrente -->
    <g transform="rotate(12)">
      <ellipse cx="-34" cy="80" rx="13" ry="15" fill="#2B1B5C"/><ellipse cx="38" cy="78" rx="13" ry="15" fill="#2B1B5C"/>
      <circle cx="-29" cy="74" r="5" fill="#fff"/><circle cx="43" cy="72" r="5" fill="#fff"/>
      <ellipse cx="-78" cy="102" rx="17" ry="10" fill="#FF8FB8"/><ellipse cx="82" cy="98" rx="17" ry="10" fill="#FF8FB8"/>
      <path d="M-12 100 Q-5 109 2 100 Q9 109 16 100" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- líneas de squish -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M428 270 q-14 -10 -10 -26"/><path d="M408 290 q-12 -6 -12 -18"/>
    <path d="M892 270 q14 -10 10 -26"/><path d="M912 290 q12 -6 12 -18"/>
  </g>
  <!-- chilito tierno (picante) -->
  <g transform="translate(250 286) rotate(-18)">
    <path d="M-50 0 C-50 -26 30 -30 56 -6 C70 8 60 24 40 20 C10 14 -20 20 -40 18 C-50 16 -50 8 -50 0 Z" fill="url(#chile)"/>
    <path d="M56 -6 C64 -16 72 -26 82 -24" fill="none" stroke="#3E9B2A" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-12" rx="14" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-4" cy="2" r="4" fill="#2B1B5C"/><circle cx="14" cy="0" r="4" fill="#2B1B5C"/>
    <path d="M0 10 Q5 14 10 10" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- limón tierno -->
  <g transform="translate(1080 288)">
    <ellipse rx="44" ry="34" fill="url(#limon)"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-10" cy="2" r="4" fill="#2B1B5C"/><circle cx="10" cy="2" r="4" fill="#2B1B5C"/>
    <path d="M-4 12 Q0 16 4 12" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
