<!-- Escena "taco" (sin estrellas: adornos de cilantro y cebolla): un taco squishy kawaii en la cocina (a Valeria le encanta cocinar y lo picante).
     Gordito y brillante, con salsa roja que escurre como slime, sobre una tabla de picar,
     con un chilito tierno y un limón. Lienzo ~3.4:1 para el panel de 1160 x 340. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 386">
  <defs>
    <radialGradient id="tortilla" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".55" stop-color="#FFD66B"/><stop offset="1" stop-color="#F2A93B"/></radialGradient>
    <linearGradient id="salsa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#D81E3A"/></linearGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B98A"/><stop offset="1" stop-color="#C98A5A"/></linearGradient>
    <radialGradient id="chile" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#E0263A"/></radialGradient>
    <radialGradient id="limon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E9FF9A"/><stop offset="1" stop-color="#7BCB2E"/></radialGradient>
  </defs>
  <!-- adornos taqueros (pocos): cilantro y cebolla -->
  <g fill="#3FBF5A" transform="translate(160 90) scale(1.4) rotate(-20)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="#3FBF5A" transform="translate(1140 90) scale(1.1) rotate(25)"><path d="M0 0 C-14 -6 -16 -22 -4 -26 C-2 -34 10 -34 10 -24 C22 -24 22 -8 10 -4 C8 4 2 6 0 0Z"/><path d="M0 0 L-2 18" stroke="#2F8F40" stroke-width="3"/></g>
  <g fill="none" transform="translate(1110 190)"><circle r="20" stroke="#E9C9FF" stroke-width="7"/><circle r="10" stroke="#D9B0FF" stroke-width="5"/></g>
  <!-- vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M520 70 q-14 -18 0 -36"/><path d="M800 70 q-14 -18 0 -36"/>
  </g>
  <!-- tabla de picar -->
  <rect x="300" y="318" width="720" height="44" rx="22" fill="url(#tabla)"/>
  <rect x="300" y="350" width="720" height="12" rx="6" fill="#A8693F" opacity=".5"/>
  <circle cx="990" cy="340" r="9" fill="#A8693F"/>
  <ellipse cx="660" cy="322" rx="190" ry="12" fill="#5A2A10" opacity=".2"/>
  <!-- taco squishy: tortilla redonda acostada; se pone la comida en medio y se levantan los dos lados.
       Abajo queda PLANO (el doblez, apoyado en la tabla); las dos medias lunas suben con la curva hacia arriba;
       la comida se ve ARRIBA, entre la orilla de atrás (más alta) y la de enfrente (con la carita). -->
  <g transform="translate(660 318) scale(1 .86)">
    <!-- media luna de ATRÁS: asoma arriba, detrás de la comida -->
    <path d="M-224 0 A224 224 0 0 1 224 0 Z" transform="translate(0 -46)" fill="#E59A35" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- comida en medio, siguiendo la curva -->
    <g fill="#8EDB3E" transform="scale(1.07)"><circle cx="212" cy="-53" r="24"/><circle cx="195" cy="-98" r="31"/><circle cx="169" cy="-138" r="31"/><circle cx="134" cy="-172" r="31"/><circle cx="93" cy="-197" r="31"/><circle cx="48" cy="-213" r="31"/><circle cx="0" cy="-218" r="31"/><circle cx="-48" cy="-213" r="31"/><circle cx="-93" cy="-197" r="31"/><circle cx="-134" cy="-172" r="31"/><circle cx="-169" cy="-138" r="31"/><circle cx="-195" cy="-98" r="31"/><circle cx="-212" cy="-53" r="24"/></g>
    <path d="M-197 -79 A212 212 0 0 1 197 -79" fill="none" stroke="url(#salsa)" stroke-width="34" transform="scale(1.04)" stroke-linecap="round"/>
    <g fill="#B5562E" transform="scale(1.06)"><circle cx="180" cy="-104" r="16"/><circle cx="134" cy="-159" r="16"/><circle cx="71" cy="-195" r="16"/><circle cx="0" cy="-208" r="16"/><circle cx="-71" cy="-195" r="16"/><circle cx="-134" cy="-159" r="16"/><circle cx="-180" cy="-104" r="16"/></g>
    <g fill="#FFF3D6" transform="scale(1.08)"><rect x="143" y="-159" width="16" height="16" rx="5"/><rect x="74" y="-206" width="16" height="16" rx="5"/><rect x="-8" y="-222" width="16" height="16" rx="5"/><rect x="-90" y="-206" width="16" height="16" rx="5"/><rect x="-159" y="-159" width="16" height="16" rx="5"/></g>
    <!-- media luna de ENFRENTE: plana abajo, curva arriba -->
    <path d="M-210 0 A210 210 0 0 1 210 0 Z" fill="url(#tortilla)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- gotita de salsa que escurre por la orilla -->
    <path d="M118 -168 C118 -148 126 -136 126 -128 C126 -116 110 -116 110 -128 C110 -136 118 -148 118 -168 Z" fill="#E0263A"/>
    <!-- puntitos tostados -->
    <g fill="#E99A3A" opacity=".55"><circle cx="-150" cy="-60" r="7"/><circle cx="-100" cy="-140" r="6"/><circle cx="130" cy="-90" r="7"/><circle cx="170" cy="-30" r="6"/><circle cx="30" cy="-170" r="5"/><circle cx="-60" cy="-24" r="5"/></g>
    <!-- brillo de squishy -->
    <ellipse cx="-104" cy="-118" rx="44" ry="14" fill="#fff" opacity=".75" transform="rotate(-40 -104 -118)"/>
    <circle cx="-58" cy="-158" r="8" fill="#fff" opacity=".85"/>
    <!-- carita kawaii -->
    <ellipse cx="-40" cy="-86" rx="14" ry="16" fill="#2B1B5C"/><ellipse cx="40" cy="-86" rx="14" ry="16" fill="#2B1B5C"/>
    <circle cx="-35" cy="-92" r="5.5" fill="#fff"/><circle cx="45" cy="-92" r="5.5" fill="#fff"/>
    <ellipse cx="-88" cy="-60" rx="18" ry="11" fill="#FF8FB8"/><ellipse cx="88" cy="-60" rx="18" ry="11" fill="#FF8FB8"/>
    <path d="M-15 -62 Q-7.5 -52 0 -62 Q7.5 -52 15 -62" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- líneas de squish -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M428 270 q-14 -10 -10 -26"/><path d="M408 290 q-12 -6 -12 -18"/>
    <path d="M892 270 q14 -10 10 -26"/><path d="M912 290 q12 -6 12 -18"/>
  </g>
  <!-- chilito tierno (picante) -->
  <g transform="translate(250 286) rotate(-18)">
    <path d="M-50 0 C-50 -26 30 -30 56 -6 C70 8 60 24 40 20 C10 14 -20 20 -40 18 C-50 16 -50 8 -50 0 Z" fill="url(#chile)"/>
    <path d="M56 -6 C64 -16 72 -26 82 -24" fill="none" stroke="#3E9B2A" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-12" rx="14" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-4" cy="2" r="4" fill="#2B1B5C"/><circle cx="14" cy="0" r="4" fill="#2B1B5C"/>
    <path d="M0 10 Q5 14 10 10" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- limón tierno -->
  <g transform="translate(1080 288)">
    <ellipse rx="44" ry="34" fill="url(#limon)"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-10" cy="2" r="4" fill="#2B1B5C"/><circle cx="10" cy="2" r="4" fill="#2B1B5C"/>
    <path d="M-4 12 Q0 16 4 12" fill="none" stroke="#2B1B5C" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
