    <path d="M-12 18 Q-6 26 0 18 Q6 26 12 18" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>
  </g>
  <!-- líneas de squish -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M428 270 q-14 -10 -10 -26"/><path d="M408 290 q-12 -6 -12 -18"/>
    <path d="M892 270 q14 -10 10 -26"/><path d="M912 290 q12 -6 12 -18"/>
  </g>
