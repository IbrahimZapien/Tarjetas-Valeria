  <path d="M404 120 C452 160 456 270 392 344 C338 404 262 418 196 414 C272 394 340 352 372 288 C398 236 404 170 404 120 Z" fill="#D8173A"/>
  <path d="M292 122 C320 86 404 80 444 136 C424 156 386 144 366 158 C346 144 312 148 292 122 Z" fill="#8DBB2A"/>
  <rect x="300" y="148" width="26" height="92" rx="13" fill="#FFD08A" transform="rotate(16 313 194)"/>
  <circle cx="276" cy="270" r="13" fill="#FFD08A"/>
  <ellipse cx="300" cy="300" rx="13" ry="15" fill="#2B1B5C"/><ellipse cx="356" cy="282" rx="13" ry="15" fill="#2B1B5C"/>
  <circle cx="305" cy="294" r="5" fill="#fff"/><circle cx="361" cy="276" r="5" fill="#fff"/>
  <path d="M318 318 Q328 328 340 312" fill="none" stroke="#2B1B5C" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="270" cy="322" rx="15" ry="9" fill="#FF9EC4" opacity=".9"/><ellipse cx="384" cy="300" rx="15" ry="9" fill="#FF9EC4" opacity=".9"/>
</g></g>
  <!-- limón tierno -->
  <g transform="translate(1080 288)">
    <ellipse rx="44" ry="34" fill="url(#limon)"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="5" fill="#fff" opacity=".6"/>
    <circle cx="-10" cy="2" r="4" fill="#2B1B5C"/><circle cx="10" cy="2" r="4" fill="#2B1B5C"/>
