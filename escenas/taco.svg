  <g fill="#3FA34D"><path d="M150 80 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(-20 150 80)"/><path d="M225 55 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(10 225 55)"/><path d="M100 150 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(-30 100 150)"/><path d="M175 190 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(20 175 190)"/><path d="M85 250 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(-10 85 250)"/><path d="M135 300 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(15 135 300)"/><path d="M270 40 c-10 -6 -12 -20 0 -24 c2 -8 14 -8 14 2 c12 0 12 16 0 20 c-2 8 -10 8 -14 2z" transform="rotate(0 270 40)"/></g>
  <!-- pared de ENFRENTE: media luna gordita -->
  <path d="M300 36 C384 26 474 62 478 134 C482 206 420 244 350 264 C282 284 244 332 172 372 C140 390 108 382 126 352 C176 300 206 172 248 100 C262 72 280 42 300 36 Z" fill="url(#tortiE)" stroke="#E89A1C" stroke-width="8" stroke-linejoin="round"/>
